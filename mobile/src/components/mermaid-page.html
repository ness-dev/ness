<!doctype html>
<!-- Template for .generated/mermaid.html (built by metro.config.js, which
     inlines mermaid.min.js at the marker). MermaidDiagram.tsx loads it in a
     hidden WebView, calls nessRender(config, source), and gets back the
     SVG and its natural size; the visible diagram is that SVG alone. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; background: transparent; }</style>
<script>/*MERMAID*/</script>
<script>
  window.nessRender = async function (config, source) {
    const post = (m) => window.ReactNativeWebView.postMessage(JSON.stringify(m))
    try {
      mermaid.initialize(config)
      const { svg } = await mermaid.render('ness-mermaid', source)
      const host = document.getElementById('out')
      host.innerHTML = svg
      const el = host.querySelector('svg')
      const vb = el && el.viewBox && el.viewBox.baseVal
      const box = el ? el.getBoundingClientRect() : { width: 0, height: 0 }
      post({ ok: true, svg, w: (vb && vb.width) || box.width, h: (vb && vb.height) || box.height })
    } catch (err) {
      post({ ok: false, error: String((err && err.message) || err) })
    }
  }
</script>
</head>
<body><div id="out"></div></body>
</html>
