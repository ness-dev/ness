name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cancel an in-flight CI run when a new commit lands on the same branch.
# Saves CI minutes during rapid pushes; the latest commit is what matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # --legacy-peer-deps because electron-vite@5 declares a peer range
      # that npm's strict resolver rejects against the installed vite@7.
      # Matches the developer-facing install instructions.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # electron-vite build does NOT run tsc on its own — so typecheck
      # is a separate, required gate.
      - name: Typecheck
        run: npm run typecheck

      # Catches missing imports, asset resolution errors, and other
      # bundler-level issues that tsc alone misses.
      - name: Build
        run: npx electron-vite build

      - name: Tests
        run: npx vitest run

      # The marketing site imports the subscription graph's cards from
      # src/renderer (SubscriptionGraphCanvas and what it pulls in), so an
      # app change can break it. tsc -b above doesn't cover site/.
      - name: Typecheck + build site
        run: npm run typecheck:site && npm run build:site

      # The Expo app (mobile/) imports shared state, transport and renderer
      # modules from src/ and calls the server through the desktop's typed
      # buildBackend API, so a desktop or server change can break it
      # without touching mobile/. Typecheck catches signature and state
      # shape drift; the iOS export catches a shared module growing an
      # import Metro can't bundle (Node / DOM / Electron-only).
      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Mobile typecheck + unit tests
        run: npm run typecheck:mobile && npm run test:mobile

      - name: Mobile bundle
        working-directory: mobile
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/mobile-export"

      # The headless server bundle is built separately from the Electron
      # build above (different vite config, different output dir). Builds
      # both `dist-headless/main` and `dist-headless/web-client`.
      - name: Build headless server
        run: npm run build:headless

      # End-to-end smoke test: launches the freshly-built headless server
      # on an ephemeral port, verifies it serves the web client, rejects
      # unauthenticated requests, accepts a WebSocket client with the
      # token, and exits cleanly on SIGTERM. Catches the class of bugs
      # where the tarball's module layout / chunk resolution / auth gate
      # is broken — bugs that previously only surfaced after a tag-push
      # release. Logic lives in scripts/smoke-headless.sh so it's
      # runnable locally and not buried in YAML.
      - name: Headless smoke test
        run: bash scripts/smoke-headless.sh

      # The mobile client's own NessClient / Fleet / list model driving the
      # freshly-built headless server over WebSocket: snapshot, repo + worktree
      # listing, aliases / pins / snoozes, panes and Chat tabs, tools-panel
      # data. A renamed handler or changed state shape fails here. Logic in
      # mobile/test/contract.test.ts.
      - name: Mobile contract test
        run: npm run test:mobile:contract
