name: Build Linux

# Dispatch-only smoke test for the Linux build. The canonical
# tag-driven release runs the Linux build inside
# .github/workflows/release.yml — this file lets us validate a Linux
# build on a branch (or via the Actions UI) without cutting a tag.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # electron-builder needs these for AppImage assembly + native module
      # rebuilds on the runner. libnss3/libgbm1 keep Electron's sandbox
      # happy if anything tries to launch it during the build.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 \
            libgbm1 \
            libasound2t64 \
            fakeroot \
            rpm

      # electron-vite@5's peer range rejects vite@7/8 under strict resolver;
      # --legacy-peer-deps mirrors the local dev install.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-linux
          path: |
            release/Ness-*.AppImage
            release/Ness-*.deb
            release/latest-linux.yml
          if-no-files-found: error
