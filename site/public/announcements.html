<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements — Ness</title>
  <meta name="description" content="News from the Ness team. New features, releases, and changes worth reading about." />

  <!-- Open Graph -->
  <meta property="og:site_name" content="Ness" />
  <meta property="og:title" content="Announcements — Ness" />
  <meta property="og:description" content="News from the Ness team. New features, releases, and changes worth reading about." />
  <meta property="og:image" content="https://getness.dev/og-image.png?v=ness" />
  <meta property="og:url" content="https://getness.dev/announcements.html" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Announcements — Ness" />
  <meta name="twitter:description" content="News from the Ness team. New features, releases, and changes worth reading about." />
  <meta name="twitter:image" content="https://getness.dev/og-image.png?v=ness" />

  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    html, body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; }
    code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .gradient-text { color: #4ade80; }
    .grid-bg {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(74, 222, 128, 0.08), transparent 50%),
        radial-gradient(circle at 0% 100%, rgba(34, 197, 94, 0.06), transparent 50%);
    }
    .post-card {
      background: rgba(10, 10, 10, 0.6);
      border: 1px solid #1f1f1f;
      border-radius: 0.875rem;
      padding: 1.5rem 1.75rem;
      transition: border-color 0.15s, background 0.15s;
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .post-card:hover {
      border-color: #404040;
      background: rgba(15, 15, 15, 0.8);
    }
    .post-card .date {
      font-size: 0.75rem;
      color: #737373;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .post-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f5f5f5;
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }
    .post-card:hover h2 {
      color: #fbbf24;
    }
    .post-card p {
      color: #a3a3a3;
      line-height: 1.6;
      margin: 0;
    }
    .post-card .arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 0.875rem;
      font-size: 0.8125rem;
      color: #737373;
      transition: color 0.15s, transform 0.15s;
    }
    .post-card:hover .arrow {
      color: #fbbf24;
    }
    .empty-state {
      border: 1px dashed #262626;
      border-radius: 0.875rem;
      padding: 3rem 1.5rem;
      text-align: center;
      color: #737373;
      font-size: 0.9375rem;
    }
  </style>
</head>
<body class="min-h-screen grid-bg">

  <!-- Nav -->
  <nav class="max-w-6xl mx-auto px-6 py-6 flex items-center justify-between relative z-30">
    <a href="/" class="flex items-center gap-3">
      <img src="/mark.svg" alt="Ness icon" class="w-9" />
      <span class="text-xl font-bold">Ness</span>
    </a>
    <div class="hidden sm:flex items-center gap-4 sm:gap-6 text-sm text-neutral-400">
      <a href="/#highlights" class="hover:text-neutral-100 transition-colors">Features</a>
      <a href="/guide.html" class="hover:text-neutral-100 transition-colors">Guide</a>
      <a href="/announcements.html" class="text-neutral-100 transition-colors">Announcements</a>
      <a href="/#install" class="hover:text-neutral-100 transition-colors">Install</a>
      <a href="https://github.com/ness-dev/ness" class="hover:text-neutral-100 transition-colors">GitHub</a>
    </div>
    <button
      id="mobile-menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      class="sm:hidden p-2 -mr-2 text-neutral-400 hover:text-neutral-100 transition-colors"
    ></button>
    <div
      id="mobile-menu"
      class="hidden sm:hidden absolute top-full left-0 right-0 mx-4 mt-1 bg-[#0a0a0a]/95 backdrop-blur border border-neutral-800 rounded-lg shadow-xl overflow-hidden"
    >
      <nav class="flex flex-col py-2 text-sm text-neutral-400">
        <a href="/#highlights" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Features</a>
        <a href="/guide.html" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Guide</a>
        <a href="/announcements.html" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Announcements</a>
        <a href="/#install" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">Install</a>
        <a href="https://github.com/ness-dev/ness" class="px-4 py-3 hover:bg-neutral-800/50 hover:text-neutral-100 transition-colors">GitHub</a>
      </nav>
    </div>
  </nav>

  <!-- Header -->
  <section class="max-w-3xl mx-auto px-6 pt-12 pb-12">
    <div class="text-xs uppercase tracking-widest text-neutral-500 mb-4">News</div>
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight leading-tight">
      <span class="gradient-text">Announcements</span>
    </h1>
  </section>

  <!-- Posts -->
  <main class="max-w-3xl mx-auto px-6 pb-24">
    <div id="posts-list" class="space-y-4">
      <div id="posts-loading" class="empty-state">Loading announcements…</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-900 mt-20">
    <div class="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-neutral-600">
      <div class="flex items-center gap-2">
        <img src="/mark.svg" alt="" class="w-5" />
        <span>Ness · Open source · MIT</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="/guide.html" class="hover:text-neutral-300 transition-colors">Guide</a>
        <a href="/announcements.html" class="text-neutral-300 transition-colors">Announcements</a>
        <a href="https://github.com/ness-dev/ness" class="hover:text-neutral-300 transition-colors">GitHub</a>
        <a href="/releases.html" class="hover:text-neutral-300 transition-colors">Release notes</a>
        <a href="https://github.com/ness-dev/ness/releases" class="hover:text-neutral-300 transition-colors">Downloads</a>
      </div>
    </div>
  </footer>

  <script type="module">
    // Data-driven render: each new announcement only needs an entry in
    // /announcements.json (with optional `summary`) and the per-post HTML
    // under /announcements/<slug>.html. The desktop-app feed validator
    // ignores fields it doesn't know about, so `summary` is safe to add.
    const listEl = document.getElementById('posts-list')
    const loadingEl = document.getElementById('posts-loading')

    const dateFmt = new Intl.DateTimeFormat('en-US', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      timeZone: 'UTC'
    })

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function render(items) {
      loadingEl?.remove()
      if (!items.length) {
        listEl.innerHTML =
          '<div class="empty-state">No announcements yet. Check back soon.</div>'
        return
      }
      const sorted = [...items].sort(
        (a, b) => Date.parse(b.publishedAt) - Date.parse(a.publishedAt)
      )
      listEl.innerHTML = sorted
        .map((a) => {
          const date = Number.isNaN(Date.parse(a.publishedAt))
            ? ''
            : dateFmt.format(new Date(a.publishedAt))
          const summary = a.summary
            ? `<p>${escapeHtml(a.summary)}</p>`
            : ''
          return `
            <a class="post-card" href="${escapeHtml(a.href)}">
              <div class="date">${escapeHtml(date)}</div>
              <h2>${escapeHtml(a.title)}</h2>
              ${summary}
              <span class="arrow">
                Read more
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              </span>
            </a>
          `
        })
        .join('')
    }

    fetch('/announcements.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
      .then((data) => {
        const items = Array.isArray(data?.announcements) ? data.announcements : []
        render(items)
      })
      .catch((err) => {
        loadingEl?.remove()
        listEl.innerHTML =
          '<div class="empty-state">Couldn\'t load announcements. Try refreshing.</div>'
        // eslint-disable-next-line no-console
        console.error('Failed to load announcements:', err)
      })
  </script>

  <script>
    (function () {
      var btn = document.getElementById('mobile-menu-toggle');
      var menu = document.getElementById('mobile-menu');
      if (!btn || !menu) return;
      var iconMenu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
      var iconX = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6"/></svg>';
      btn.innerHTML = iconMenu;
      var open = false;
      function setOpen(next) {
        open = next;
        menu.classList.toggle('hidden', !open);
        btn.innerHTML = open ? iconX : iconMenu;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        document.body.classList.toggle('overflow-hidden', open);
      }
      btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!open); });
      document.addEventListener('mousedown', function (e) {
        if (!open) return;
        if (!menu.contains(e.target) && !btn.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (open && e.key === 'Escape') setOpen(false);
      });
      menu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
    })();
  </script>
</body>
</html>
